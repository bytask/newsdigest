# 任意: main への push でコンソールを自動デプロイする。
# 使う場合はリポジトリの Secrets に CLOUDFLARE_API_TOKEN（Workers Scripts:Edit + D1:Edit）と
# CLOUDFLARE_ACCOUNT_ID を登録する。使わないならこのファイルは削除してよい（ローカルの
# `npm run console:deploy` だけでも運用できる）。
name: deploy-console
on:
  push:
    branches: [main]
    paths: ["apps/console/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CONSOLE_AUTO_DEPLOY == 'true' }}
    defaults: { run: { working-directory: apps/console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/console/package-lock.json }
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
